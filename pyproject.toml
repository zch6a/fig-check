[project]
name = "fig-check"
version = "0.1.0"
description = "Check a paper's figures as they will print: font sizes at their printed scale, colours that people with colour vision deficiency cannot tell apart, raster resolution. For a LaTeX project at the widths its figures print at, or single PDF, PNG, JPEG and SVG files."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "zch6a" }]
keywords = ["figures", "latex", "matplotlib", "colorblind", "accessibility", "font-size", "dpi", "paper", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# No dependencies: zlib and struct for PDF and PNG, xml.etree for SVG.
dependencies = []

[project.urls]
Homepage = "https://github.com/zch6a/fig-check"
Issues = "https://github.com/zch6a/fig-check/issues"

[project.scripts]
fig-check = "fig_check.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fig_check"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/"]  # images for the GitHub page only

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "matplotlib>=3.7"]  # matplotlib: to test check_figure on real figures

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src", "tests"]
addopts = "--doctest-modules --import-mode=importlib"

[tool.mypy]
python_version = "3.10"
files = ["src/fig_check"]
ignore_missing_imports = true

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

